<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- 安卓 WebView 默认按 980px 宽的虚拟视口渲染再整页缩小，不写这句界面会缩成 1/3、
     图标只有十几物理像素，点也点不准。桌面 Chromium 不使用移动视口，这句对它无效。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>墨读</title>
<!--
  形态标记（竖屏 / 横屏）：必须在这里同步跑完，且不能依赖任何外部脚本。

  之前这个标记由安卓的 nodebundle.js 打上。一旦那份脚本没跑起来（打包没替换、
  WebView 请求拦截没触发、旧 WebView 语法不兼容……任何一种），页面就会静默退回
  电脑版布局：左侧功能栏 + 右上角最小化/最大化/关闭，而且控制台没有任何线索。

  所以这里用最保守的 ES5 再打一次，并自己盯住 resize / orientationchange / visualViewport。
  判定只认「原生对象存在」或「UA 带 MoReadAndroid」，桌面 Electron 两个都不满足，直接跳过。
-->
<script>
(function () {
  var isApp = (typeof MoNativeBridge !== 'undefined') ||
              (navigator.userAgent && navigator.userAgent.indexOf('MoReadAndroid') >= 0);
  if (!isApp) return;
  var de = document.documentElement;
  de.className += ' is-android';
  function bucket(v) { return v >= 840 ? 'expanded' : (v >= 600 ? 'medium' : 'compact'); }
  function apply() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!w || !h) return;
    de.setAttribute('data-layout', w > h ? 'landscape' : 'portrait');
    if (!de.getAttribute('data-sw')) de.setAttribute('data-sw', bucket(Math.min(w, h)));
  }
  apply();
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', function () { apply(); setTimeout(apply, 120); setTimeout(apply, 420); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', apply);
  function strip() {
    var n = document.querySelector('.winbtns'); if (n && n.parentNode) n.parentNode.removeChild(n);
    var d = document.querySelector('.dropzone'); if (d && d.parentNode) d.parentNode.removeChild(d);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', strip);
  else strip();
})();
</script>
<!--
  安卓自检面板。纯 ES5，只依赖「有没有 MoNativeBridge」，所以即使兼容层彻底挂掉它也能跑。
    · 兼容层没起来时 2.5 秒后自动弹出（否则界面看着正常但所有功能都是死的一片安静）
    · 也可以长按顶栏 1.2 秒手动打开
  它会把桥通不通、文件读写、大文件 XHR、联网、WebView 版本逐项列出来，便于定位。
-->
<script>
(function () {
  var isApp = (typeof MoNativeBridge !== 'undefined') ||
              (navigator.userAgent && navigator.userAgent.indexOf('MoReadAndroid') >= 0);
  if (!isApp) return;

  window.__moLog = [];
  window.addEventListener('error', function (e) {
    try { window.__moLog.push('[error] ' + (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); } catch (x) { }
  });
  window.addEventListener('unhandledrejection', function (e) {
    try { window.__moLog.push('[reject] ' + ((e.reason && (e.reason.message || e.reason)) || '')); } catch (x) { }
  });
  var ce = console.error;
  console.error = function () {
    try { window.__moLog.push('[console] ' + Array.prototype.slice.call(arguments).join(' ').slice(0, 300)); } catch (x) { }
    if (ce) ce.apply(console, arguments);
  };

  function call(name, args) {
    try { return String(MoNativeBridge.callSync(name, args || '{}')).slice(0, 240); }
    catch (e) { return 'ERROR: ' + (e && e.message || e); }
  }
  function jsons(args) { try { return JSON.stringify(args); } catch (e) { return '{}'; } }

  var items = [];
  function add(k, v) { items.push([k, String(v)]); }

  function collect() {
    items = [];
    add('WebView', navigator.userAgent);
    add('视口', window.innerWidth + ' × ' + window.innerHeight + '   dpr=' + window.devicePixelRatio);
    add('形态标记', document.documentElement.getAttribute('data-layout') + ' / ' + document.documentElement.getAttribute('data-sw'));
    add('原生对象 MoNativeBridge', typeof MoNativeBridge);
    add('设备 WebView（系统提供）', (function () {
      try { return JSON.parse(call('env.webview')).pkg; } catch (e) { return '读取失败'; }
    })());
    add('桥 env.info', call('env.info'));
    add('兼容层初始化步骤', (function () {
      var s = window.__moreadSteps;
      if (!s || !s.length) return '（无记录 —— 兼容层根本没开始执行）';
      var out = [];
      for (var i = 0; i < s.length; i++) {
        out.push((s[i].ok ? '✓ ' : '✗ ') + s[i].n + '  ' + s[i].ms + 'ms' + (s[i].e ? '\n    ' + s[i].e : ''));
      }
      return out.join('\n');
    })());
    add('桥 env.layout', call('env.layout'));
    add('桥 env.insets', call('env.insets'));
    add('bundle 已执行', typeof window.__MOREAD_MODULES__ !== 'undefined' ? '是（' + Object.keys(window.__MOREAD_MODULES__).join(',') + '）' : '否');
    add('window.mo', typeof window.mo);
    add('window.MoNative', typeof window.MoNative);
    add('window.MoApp', typeof window.MoApp);
    add('文件写入', call('file.write', jsons({ path: 'diag/probe.txt', text: 'hello-modu' })));
    var rd = call('file.read', jsons({ path: 'diag/probe.txt', text: true }));
    add('文件读回', rd);
    try { add('文件读写一致', JSON.parse(rd).text === 'hello-modu' ? 'OK' : '不一致'); }
    catch (e) { add('文件读写一致', '解析失败'); }
    // 大文件走的是「超过 512KB 返回 file:// 路径 + 同步 XHR 读取」那条路
    try {
      var big = new Array(600 * 1024 + 1).join('x');
      call('file.write', jsons({ path: 'diag/big.txt', text: big }));
      var r = JSON.parse(call('file.read', jsons({ path: 'diag/big.txt', text: true })));
      if (!r.tooBig) add('大文件分支', '未触发（size=' + (r.size || 0) + '）');
      else {
        var x = new XMLHttpRequest();
        x.open('GET', r.abs, false); x.send(null);
        var t = x.responseText || '';
        add('大文件 XHR', '读到 ' + t.length + ' 字符（写入 ' + big.length + '）' + (t.length === big.length ? '  OK' : '  不一致'));
      }
    } catch (e) { add('大文件 XHR', 'ERROR: ' + (e && e.message || e)); }
    add('zlib', (function () {
      try {
        var r = JSON.parse(call('zlib.deflateRaw', jsons({ b64: btoa('hello') })));
        return r.b64 ? 'OK' : ('ERROR ' + (r.error || ''));
      } catch (e) { return 'ERROR: ' + (e && e.message || e); }
    })());
    add('JS 引擎', (function () {
      try { new Function('return ({a:1})?.a'); return '支持可选链（较新）'; }
      catch (e) { return '不支持可选链（WebView 较旧，但本项目未使用该语法）'; }
    })());
    add('页面错误', window.__moLog.length ? window.__moLog.join('\n') : '（无）');
  }

  function render(extra) {
    var old = document.getElementById('mo-diag');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var wrap = document.createElement('div');
    wrap.id = 'mo-diag';
    wrap.style.cssText = 'position:fixed;z-index:999999;left:0;top:0;right:0;bottom:0;overflow:auto;' +
      'background:#fff;color:#111;font:13px/1.65 monospace;padding:14px 14px 40px;-webkit-overflow-scrolling:touch;';
    var h = '<div style="font:600 16px/1.4 system-ui;margin-bottom:10px">墨读 · 自检</div>';
    if (extra) h += '<div style="background:#b3261e;color:#fff;padding:8px 10px;border-radius:6px;margin-bottom:10px">' + extra + '</div>';
    for (var i = 0; i < items.length; i++) {
      h += '<div style="border-bottom:1px solid #eee;padding:6px 0">' +
        '<div style="color:#666">' + String(items[i][0]).replace(/</g, '&lt;') + '</div>' +
        '<div style="white-space:pre-wrap;word-break:break-all">' + String(items[i][1]).replace(/</g, '&lt;') + '</div></div>';
    }
    h += '<div id="mo-diag-net" style="margin-top:10px;color:#333">联网测试：进行中…</div>';
    h += '<button id="mo-diag-again" style="margin-top:12px;padding:10px 16px;font-size:15px">重新自检</button> ';
    h += '<button id="mo-diag-close" style="margin-top:12px;padding:10px 16px;font-size:15px">关闭</button>';
    wrap.innerHTML = h;
    document.body.appendChild(wrap);
    document.getElementById('mo-diag-close').onclick = function () {
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
    };
    document.getElementById('mo-diag-again').onclick = function () { collect(); render(null); netTest(); };
  }

  function netTest() {
    var box = document.getElementById('mo-diag-net');
    if (!box) return;
    try {
      if (!window.mo || !window.mo.net) { box.textContent = '联网测试：window.mo.net 不存在（兼容层未就绪）'; return; }
      var t0 = Date.now();
      window.mo.net({ url: 'https://www.baidu.com', charset: 'auto' }).then(function (r) {
        box.textContent = '联网测试：HTTP ' + (r && r.status) + '  ' + ((r && r.text || '').length) + ' 字符  ' + (Date.now() - t0) + 'ms';
      }, function (e) {
        box.textContent = '联网测试：失败 → ' + ((e && e.message) || e);
      });
    } catch (e) { box.textContent = '联网测试：异常 → ' + (e && e.message || e); }
  }

  window.__moreadDiag = function (note) {
    try { collect(); render(note || null); netTest(); }
    catch (e) { alert('自检自身出错：' + (e && e.message || e)); }
  };

  // 兼容层没起来就自动弹，避免「界面好好的但什么都用不了」这种无声失败
  window.setTimeout(function () {
    if (!window.mo) {
      window.__moreadDiag('兼容层未就绪（window.mo 不存在），界面已渲染但所有功能不可用。下面是自检结果，请截图发给我。');
    }
  }, 2500);

  // 长按顶栏也能手动打开
  function bindLongPress() {
    var bar = document.getElementById('titlebar');
    if (!bar) return;
    var timer = null;
    function start() { timer = window.setTimeout(function () { window.__moreadDiag(null); }, 1200); }
    function cancel() { if (timer) { window.clearTimeout(timer); timer = null; } }
    bar.addEventListener('touchstart', start, false);
    bar.addEventListener('touchend', cancel, false);
    bar.addEventListener('touchmove', cancel, false);
    bar.addEventListener('mousedown', start, false);
    bar.addEventListener('mouseup', cancel, false);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindLongPress);
  else bindLongPress();
})();
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="titlebar" id="titlebar">
    <div class="brand">
      <span class="logo">墨</span>
      <span class="bname">墨读</span>
    </div>
    <div class="tb-title" id="tb-title">书架</div>
    <div class="tb-actions">
      <button class="tb-btn" id="btn-search" title="搜索 (Ctrl+F)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </button>
      <button class="tb-btn" id="btn-import" title="导入本地书 (Ctrl+O)">
        <svg viewBox="0 0 24 24"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
      </button>
    </div>
    <div class="winbtns">
      <button id="btn-min" title="最小化"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="btn-max" title="最大化"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
      <button id="btn-close" class="close" title="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail">
      <button class="rail-btn active" data-view="shelf">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M9 4h4.5A1.5 1.5 0 0 1 15 5.5v13a1.5 1.5 0 0 1-1.5 1.5H9"/><path d="M16.4 5.2l3.3.9a1.5 1.5 0 0 1 1.05 1.83l-3.4 12.6"/></svg>
        <span>书架</span>
      </button>
      <button class="rail-btn" data-view="sources">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M3.8 12h16.4M12 3.8c2.2 2.3 3.3 5.1 3.3 8.2S14.2 17.9 12 20.2c-2.2-2.3-3.3-5.1-3.3-8.2S9.8 6.1 12 3.8z"/></svg>
        <span>书源</span>
      </button>
      <button class="rail-btn" data-view="web">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4M3.8 12h16.4"/></svg>
        <span>网页</span>
      </button>
      <button class="rail-btn" data-view="bookmarks">
        <svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
        <span>书签</span>
      </button>
      <button class="rail-btn" data-view="history">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.5V12l3 1.8"/></svg>
        <span>历史</span>
      </button>
      <button class="rail-btn" data-view="stats">
        <svg viewBox="0 0 24 24"><path d="M5 19V9M12 19V5M19 19v-6"/></svg>
        <span>统计</span>
      </button>
      <div class="rail-gap"></div>
      <button class="rail-btn" data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.05V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.2.6.77 1 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        <span>设置</span>
      </button>
    </nav>

    <main class="main" id="main">
      <section class="view active" id="view-shelf">
        <div class="page-head">
          <h1>书架</h1>
          <span class="sub" id="shelf-sub"></span>
          <div class="head-tools">
            <div class="searchbox">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
              <input id="quick-search" placeholder="搜索书名 / 作者，回车搜索网络书源" />
            </div>
            <button class="btn" id="btn-import2">
              <svg viewBox="0 0 24 24"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
              导入本地书
            </button>
          </div>
        </div>
        <div id="shelf-hero"></div>
        <div class="shelf-head">
          <div class="tabs" id="group-tabs"></div>
          <div class="line"></div>
          <div class="seg" id="shelf-filter">
            <button class="on" data-f="all">全部</button>
            <button data-f="local">本地</button>
            <button data-f="online">在线</button>
          </div>
        </div>
        <div class="grid" id="books"></div>
        <div class="drop-hint">把 <b>.txt</b> / <b>.epub</b> 拖进窗口即可导入；在线书在书源里搜索后加入书架</div>
      </section>

      <section class="view" id="view-search"></section>
      <section class="view" id="view-sources"></section>
      <section class="view" id="view-web"></section>
      <section class="view" id="view-bookmarks"></section>
      <section class="view" id="view-history"></section>
      <section class="view" id="view-stats"></section>
      <section class="view" id="view-settings"></section>
    </main>
  </div>
</div>

<!-- 阅读器 -->
<div class="reader" id="reader" data-theme="paper">
  <div class="reader-top">
    <button class="rback" id="r-back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>书架
    </button>
    <div class="rtitle" id="r-title"></div>
    <div class="rtools">
      <span class="r-src" id="r-loading"></span>
      <button class="icbtn" id="r-switch" title="换源（同名多源对比）"><svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></button>
      <button class="icbtn" id="r-toc" title="目录 (C)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button>
      <button class="icbtn" id="r-bookmark" title="添加书签 (B)"><svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg></button>
      <button class="icbtn" id="r-full" title="全屏 (F11)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="icbtn" id="r-close" title="退出 (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="reader-stage" id="r-stage"><div class="page" id="r-page"></div></div>
  <div class="toc" id="r-toc-panel">
    <div class="toc-head"><span>目录</span><span id="toc-count"></span></div>
    <div class="toc-list" id="toc-list"></div>
  </div>
  <div class="toc-mask" id="toc-mask"></div>
  <div class="reader-bot">
    <div class="rb-row">
      <button class="rb-btn" id="r-prev">上一章</button>
      <div class="rb-progress">
        <span class="rb-num" id="r-pct">0%</span>

      <div class="swatches" id="r-swatches">
        <button class="sw on" data-t="paper" style="background:#fbfaf7" title="纸白"></button>
        <button class="sw" data-t="sepia" style="background:#f6efe1" title="米黄"></button>
        <button class="sw" data-t="green" style="background:#e6efe4" title="浅绿"></button>
        <button class="sw" data-t="night" style="background:#1a1e24" title="夜间"></button>
      </div>
      <div class="rb-spacer"></div>
      <button class="rb-btn ghost" id="r-tts-set" title="音色 / 语速">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.05V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.2.6.77 1 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="rb-btn" id="r-tts">

      </button>
      <button class="rb-btn ghost" id="r-info"></button>
    </div>
  </div>
</div>

<!-- 通用弹窗 -->
