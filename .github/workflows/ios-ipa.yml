name: iOS 未签名 ipa

# 用途：没有 Mac 也能出 ipa —— 借 GitHub 免费的 macOS runner 跑 xcodebuild。
#   · 手动触发：Actions → 本工作流 → Run workflow
#   · push 标签 ios-v* 时自动跑，并把 ipa 挂到该 Release 上
#
# 产出是 **未签名** ipa，还需要用自己的 Apple ID 重签（Sideloadly / AltStore / 爱思助手）。
# 想直接出签好的包，请在自己 Mac 上跑 ios/scripts/build-ipa.sh signed。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支/标签（留空=当前）'
        required: false
        default: ''
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild（无签名）
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成前端产物并同步进 iOS 工程
        run: |
          node build/gen-web.js
          node build/sync-ios.js
          echo "---- 版本 / 平台 ----"
          grep -oE "version: '[0-9.]+', code: [0-9]+" ios/MoRead/web/bridge-web.js | head -1
          grep -oE "platform: '[a-z]+'" ios/MoRead/web/bridge-web.js | head -1
          ls ios/MoRead/web | wc -l

      - name: 环境信息
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: 编译（CODE_SIGNING_ALLOWED=NO）
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/MoRead.xcodeproj \
            -scheme MoRead \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tee build.log | tail -40

      - name: 组装 Payload → ipa
        id: pack
        run: |
          set -euo pipefail
          APP="ios/build/Build/Products/Release-iphoneos/MoRead.app"
          if [ ! -d "$APP" ]; then echo "找不到 $APP"; grep -i error build.log | head -20; exit 1; fi
          echo "---- 产物结构 ----"
          ls "$APP" | head
          plutil -p "$APP/Info.plist" | grep -E 'CFBundle(ShortVersionString|Version|Identifier|DisplayName)'
          echo "web 目录：$(ls "$APP/web" 2>/dev/null | wc -l) 个文件"

          VER=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          # 未签名包：显式不带 _CodeSignature，避免个别重签工具把它当已签名
          rm -rf dist/Payload/MoRead.app/_CodeSignature
          OUT="dist/MoRead-$VER-unsigned.ipa"
          (cd dist && zip -qry "$(basename "$OUT")" Payload)
          ls -la "$OUT"
          echo "ipa=$OUT" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MoRead-ipa-${{ steps.pack.outputs.ver }}
          path: ${{ steps.pack.outputs.ipa }}
          if-no-files-found: error
          retention-days: 30

      - name: 构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 打标签时挂到 Release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.ipa }}
          name: 墨读 iOS ${{ steps.pack.outputs.ver }}
          body: |
            未签名 ipa，需要自己用 Apple ID 重签后安装：

            - **Sideloadly**（Windows / macOS 都行）：加载 ipa → 填 Apple ID → Start
            - **AltStore**：AltServer 在电脑上跑，手机同网段装
            - **爱思助手**：工具箱 → ipa 签名

            免费 Apple ID 签的包 7 天到期，重签覆盖安装即可，书架数据不丢。
            想要一年有效期：付费开发者账号（￥688/年）或 TestFlight。
          draft: false
          prerelease: false
