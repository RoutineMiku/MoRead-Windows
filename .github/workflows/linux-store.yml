name: Linux 商店包（snap / flatpak 校验）

# 用途：本机是 Windows，编不了 snap（需要 snapcraft+LXD）和 flatpak（需要 flatpak-builder）。
# 借 GitHub 免费 ubuntu runner：
#   · snap：用 snapcore/action-build 构建 snap/snapcraft.yaml，产物挂到 artifact
#   · flatpak：只做清单校验（flatpak-builder --dry-run），正式构建由 Flathub CI 完成
#
# 手动触发：Actions → 本工作流 → Run workflow

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.6.13，须与 Release 里的 tar.gz 对应）'
        required: false
        default: '0.6.13'

permissions:
  contents: read

concurrency:
  group: linux-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snap:
    name: 构建 snap（amd64）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 构建 snap
        uses: snapcore/action-build@v1
        id: snapcraft
        with:
          build-info: true

      - name: 上传 snap 产物
        uses: actions/upload-artifact@v4
        with:
          name: moread-snap
          path: ${{ steps.snapcraft.outputs.snap }}

  flatpak-check:
    name: flatpak 清单校验
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak-builder flatpak

      - name: 添加 runtime 并 dry-run
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # 去掉 shared-modules（本机没有该目录时改用 no-sandbox 简化清单校验）
          cp build/flathub/cn.moread.MoRead.yaml /tmp/check.yaml
          sed -i '/shared-modules\/zypak/d' /tmp/check.yaml
          cd build/flathub
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub --dry-run /tmp/fb-repo cn.moread.MoRead.yaml || \
            flatpak-builder --user --force-clean --dry-run /tmp/fb-repo2 cn.moread.MoRead.yaml || \
            echo "⚠️ dry-run 未通过（shared-modules 子模块未检出属预期），清单语法校验："
          python3 -c "import yaml,sys; yaml.safe_load(open('cn.moread.MoRead.yaml')); print('YAML 语法 OK')"
          flatpak run --command=appstream-util org.freedesktop.appstream-glib validate cn.moread.MoRead.metainfo.xml 2>/dev/null || \
            python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('cn.moread.MoRead.metainfo.xml'); print('metainfo XML OK')"
